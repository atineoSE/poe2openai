version: '3.8'
services:
  poe2openai:
    image: poe2openai
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - LOG_LEVEL=info
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=poe2openai
      - MAX_REQUEST_SIZE=1073741824
      - CONFIG_DIR=/data
      - RATE_LIMIT_MS=0
      - URL_CACHE_TTL_SECONDS=259200
      - URL_CACHE_SIZE_MB=100
    volumes:
      - ../data:/data
